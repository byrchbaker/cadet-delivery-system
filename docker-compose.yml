# One container, one volume. `docker compose up -d` and you're running.
services:
  app:
    build: .
    image: cadet-delivery-system
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - cds-data:/data

volumes:
  cds-data:
